name: oneshot-lockfix
on:
  push:
    branches: [ci/oneshot-lockfix]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate lockfiles
        working-directory: apps/api
        run: bash scripts/compile_lockfiles.sh
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- apps/api/requirements.lock apps/api/requirements-dev.lock; then
            git add apps/api/requirements.lock apps/api/requirements-dev.lock
            git commit -m "fix(api): resync lockfiles with pyproject (Linux recompile)"
            git push origin HEAD:ci/oneshot-lockfix
          else
            echo "Lockfiles already in sync."
          fi
