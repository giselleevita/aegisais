name: AegisAIS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  supply-chain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Audit coverage gate
        run: python3 scripts/check_audit_coverage.py

      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./apps/api
          format: cyclonedx-json
          output-file: backend-sbom.cdx.json

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./apps/web
          format: cyclonedx-json
          output-file: frontend-sbom.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-sboms
          path: |
            backend-sbom.cdx.json
            frontend-sbom.cdx.json

      - name: Attest SBOM provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            backend-sbom.cdx.json
            frontend-sbom.cdx.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend audit tooling
        working-directory: apps/api
        run: |
          # pip-tools 7.5 still imports an internal API removed in pip 26.
          # Keep the resolver on the supported pip major until pip-tools ships
          # compatibility, otherwise pip-sync fails before the audit runs.
          python -m pip install --upgrade "pip<26"
          python -m pip install pip-audit==2.10.0 pip-tools==7.5.3
          pip-sync requirements-dev.lock

      - name: Backend vulnerability gate
        working-directory: apps/api
        run: |
          pip-audit -r requirements.lock \
            --ignore-vuln CVE-2024-23342 \
            --ignore-vuln PYSEC-2026-161

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend vulnerability gate
        run: python3 scripts/check_frontend_audit.py

  backend:
    runs-on: ubuntu-latest
    needs: supply-chain
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-aegisais-test-secret-2026-not-for-production
    defaults:
      run:
        working-directory: apps/api

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependency tooling
        run: |
          python -m pip install --upgrade "pip<26"
          python -m pip install pip-tools==7.5.3

      - name: Validate lockfiles
        if: matrix.python-version == '3.11'
        run: |
          ./scripts/check_lockfiles.sh

      - name: Sync backend dependencies
        run: |
          pip-sync requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Lint (ruff)
        run: |
          python -m ruff check app

      - name: Type check (mypy)
        run: |
          python -m mypy app

      - name: Run backend tests
        run: |
          python -m pytest -q

      - name: Validate contract samples
        if: matrix.python-version == '3.11'
        run: |
          python ../../scripts/check_contract_samples.py

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: apps/api/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    needs: supply-chain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Lint web app
        run: npm run lint -w @aegisais/web

      - name: Build web app
        run: npm run build -w @aegisais/web

  # Fast path: e2e harness exits 0 without installing browsers (regression guard for script).
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: E2E script (skipped when E2E=0)
        run: E2E=0 npm run test:e2e -w @aegisais/web

  e2e-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (system deps + browsers)
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e -w @aegisais/web
        env:
          CI: "true"

  festival-real-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: aegisfestivalci
      POSTGRES_HOST_PORT: "5433"
      REDIS_HOST_PORT: "6380"
      API_HOST_PORT: "58000"
      BFF_HOST_PORT: "58081"
      WEB_HOST_PORT: "55174"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:55174,http://localhost:55174
      VITE_OFFLINE_DEMO: "true"
      FESTIVAL_TEST_USERNAME: festival-ci-admin
      FESTIVAL_TEST_PASSWORD: festival-ci-password-2026
      API_URL: http://127.0.0.1:58000
      BASE_URL: http://127.0.0.1:55174
      REAL_STACK: "1"
      FESTIVAL_LATENCY_OUTPUT: artifacts/festival-latency.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start isolated festival stack
        run: |
          mkdir -p artifacts
          docker compose -f infra/docker/docker-compose.yml up -d --build --wait --wait-timeout 240 \
            db redis api processing-worker persistence-worker observation-worker alert-worker bff web

      - name: Seed non-production festival admin
        run: |
          docker compose -f infra/docker/docker-compose.yml exec -T \
            -e FESTIVAL_TEST_USERNAME -e FESTIVAL_TEST_PASSWORD \
            api python scripts/seed_demo_admin.py

      - name: Run festival preflight
        run: ./scripts/festival_preflight.sh

      - name: Enforce five-run replay latency and state thresholds
        run: python3 scripts/benchmark_festival_replay.py

      - name: Run two-cycle offline browser acceptance
        working-directory: apps/web
        run: npx playwright test e2e/festival-real-stack.spec.ts --project=chromium
        env:
          CI: "true"

      - name: Capture compose logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --no-color > artifacts/compose.log

      - name: Upload festival acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: festival-real-stack-evidence
          path: |
            artifacts/
            apps/web/test-results/
          if-no-files-found: ignore

      - name: Stop isolated festival stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down --volumes --remove-orphans
